<!doctype html>

<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Calculatrice</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="ecran"><span>bonjour</span></div>
        <div class="boutons">
            <button class="boutonChiffre">7</button>
            <button class="boutonChiffre">8</button>
            <button class="boutonChiffre">9</button>
            <button class="boutonOperateur">+</button>
            <button class="boutonChiffre">4</button>
            <button class="boutonChiffre">5</button>
            <button class="boutonChiffre">6</button>
            <button class="boutonOperateur">&minus;</button>
            <button class="boutonChiffre">1</button>
            <button class="boutonChiffre">2</button>
            <button class="boutonChiffre">3</button>
            <button class="boutonOperateur">&times;</button>
            <button><a href="https://www.theodinproject.com/lessons/foundations-calculator"><img src="https://www.theodinproject.com/favicon.ico" class="odin"></a></button>
            <button class="boutonChiffre">0</button>
            <button class="boutonVirgule">,</button>
            <button class="boutonOperateur">&divide;</button>
            <button><a href="https://github.com/damienb-8/calculatrice"><img src="https://github.com/favicon.ico" class="github"></a></button>
            <button class="boutonEffacer">Effacer</button>
            <button class="boutonRetour">Retour</button>
            <button class="boutonEgal">=</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
